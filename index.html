<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>智慧工厂安全监测控制平台 · XA-202606</title>

<style>
:root{--bg:#040a12;--surface:#071524;--panel:#0a1e32;--border:#0d4a7a;--accent:#00c8ff;--accent2:#00ff9f;--warn:#ffb300;--danger:#ff3d3d;--text:#c8e4f8;--muted:#4a7090;--grid-line:rgba(0,200,255,0.06)}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Noto Sans SC',sans-serif;font-size:13px;min-height:100vh;overflow-x:hidden;background-image:linear-gradient(var(--grid-line) 1px,transparent 1px),linear-gradient(90deg,var(--grid-line) 1px,transparent 1px);background-size:40px 40px}
header{display:flex;align-items:center;justify-content:space-between;padding:0 28px;height:60px;background:linear-gradient(90deg,#020c18 0%,#061726 60%,#020c18 100%);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100;box-shadow:0 0 40px rgba(0,200,255,0.08)}
.logo{display:flex;align-items:center;gap:12px}
.logo-icon{width:36px;height:36px;border:2px solid var(--accent);display:grid;place-items:center;font-size:18px;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);background:rgba(0,200,255,0.1);color:var(--accent);animation:pulse-border 3s infinite}
@keyframes pulse-border{0%,100%{box-shadow:0 0 0 0 rgba(0,200,255,0.4)}50%{box-shadow:0 0 0 6px rgba(0,200,255,0)}}
.logo-text{font-family:'Orbitron',sans-serif;font-weight:700;font-size:15px;letter-spacing:2px;color:var(--accent);text-shadow:0 0 20px rgba(0,200,255,0.6)}
.logo-sub{font-size:10px;color:var(--muted);letter-spacing:1px;margin-top:2px}
.header-center{font-family:'Noto Sans SC',sans-serif;font-weight:500;font-size:16px;letter-spacing:4px;color:#fff;text-shadow:0 0 30px rgba(0,200,255,0.4)}
.header-right{display:flex;align-items:center;gap:20px;font-family:'Share Tech Mono',monospace;font-size:12px;color:var(--muted)}
.status-dot{width:8px;height:8px;border-radius:50%;background:var(--accent2);box-shadow:0 0 8px var(--accent2);animation:blink 1.4s infinite;display:inline-block;margin-right:6px}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}
#clock{color:var(--accent);font-size:14px}
.container{padding:20px 24px 28px}
.overview-bar{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:20px}
.ov-card{background:var(--panel);border:1px solid var(--border);border-radius:4px;padding:12px 16px;display:flex;align-items:center;gap:12px;position:relative;overflow:hidden;cursor:pointer;transition:border-color .3s}
.ov-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:var(--accent)}
.ov-card:hover{border-color:var(--accent)}
.ov-icon{font-size:28px;line-height:1}
.ov-label{font-size:11px;color:var(--muted);letter-spacing:1px}
.ov-value{font-family:'Orbitron',sans-serif;font-size:18px;color:#fff}
.ov-status{font-size:11px;margin-top:2px}
.ok{color:var(--accent2)}.warn{color:var(--warn)}.danger{color:var(--danger)}
.panels{display:grid;grid-template-columns:1fr 1fr 1fr;grid-template-rows:auto auto;gap:16px}
.panel{background:var(--panel);border:1px solid var(--border);border-radius:4px;overflow:hidden;position:relative}
.panel::after{content:'';position:absolute;inset:0;pointer-events:none;background:linear-gradient(135deg,rgba(0,200,255,0.03) 0%,transparent 60%)}
.panel-header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--border);background:rgba(0,0,0,0.2)}
.panel-title{display:flex;align-items:center;gap:8px;font-family:'Orbitron',sans-serif;font-size:11px;letter-spacing:2px;color:var(--accent)}
.panel-badge{font-family:'Share Tech Mono',monospace;font-size:10px;padding:2px 8px;border-radius:2px;background:rgba(0,200,255,0.1);border:1px solid rgba(0,200,255,0.3);color:var(--accent)}
.panel-body{padding:16px}
.temp-hum-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.gauge-wrap{text-align:center}
.gauge-label{font-size:11px;color:var(--muted);letter-spacing:1px;margin-bottom:8px}
.gauge-svg{width:120px;height:70px;overflow:visible;display:block;margin:0 auto}
.gauge-val{font-family:'Orbitron',sans-serif;font-size:22px;color:#fff;margin-top:4px}
.gauge-val span{font-size:12px;color:var(--muted)}
.ir-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.ir-zone{background:var(--surface);border:1px solid var(--border);border-radius:3px;padding:8px;text-align:center;transition:all .4s;cursor:default}
.ir-zone.triggered{border-color:var(--danger);background:rgba(255,61,61,0.08);box-shadow:0 0 12px rgba(255,61,61,0.2)}
.ir-zone-name{font-size:10px;color:var(--muted);margin-bottom:4px}
.ir-zone-status{font-size:20px}
.ir-zone-val{font-family:'Share Tech Mono',monospace;font-size:11px;margin-top:2px}
.ir-log{background:var(--surface);border-radius:3px;padding:8px;max-height:80px;overflow-y:auto}
.ir-log-entry{font-family:'Share Tech Mono',monospace;font-size:10px;color:var(--muted);padding:1px 0}
.ir-log-entry.new{color:var(--warn)}
.gas-bars{display:flex;flex-direction:column;gap:10px}
.gas-row{display:flex;align-items:center;gap:10px}
.gas-name{font-size:11px;color:var(--muted);width:60px;flex-shrink:0}
.gas-bar-bg{flex:1;height:8px;background:var(--surface);border-radius:4px;overflow:hidden;border:1px solid rgba(255,255,255,0.05)}
.gas-bar-fill{height:100%;border-radius:4px;transition:width .8s cubic-bezier(.4,0,.2,1);position:relative}
.gas-bar-fill::after{content:'';position:absolute;top:0;right:0;bottom:0;left:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,0.2));animation:shimmer 2s infinite}
@keyframes shimmer{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
.gas-ppm{font-family:'Share Tech Mono',monospace;font-size:11px;width:60px;text-align:right;flex-shrink:0}
.gas-alert{font-size:10px;margin-top:4px;padding:4px 8px;border-radius:2px}
.gas-alert.safe{background:rgba(0,255,159,0.08);color:var(--accent2);border:1px solid rgba(0,255,159,0.2)}
.gas-alert.alarm{background:rgba(255,61,61,0.12);color:var(--danger);border:1px solid rgba(255,61,61,0.3);animation:flash-border 1s infinite}
@keyframes flash-border{0%,100%{border-color:rgba(255,61,61,.3)}50%{border-color:rgba(255,61,61,.9)}}
#agv-canvas{width:100%;height:220px;display:block;border-radius:3px;background:#020d18;border:1px solid rgba(0,200,255,0.1)}
.agv-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.agv-stat{text-align:center}
.agv-stat-val{font-family:'Orbitron',sans-serif;font-size:16px;color:#fff}
.agv-stat-label{font-size:10px;color:var(--muted);margin-top:2px}
